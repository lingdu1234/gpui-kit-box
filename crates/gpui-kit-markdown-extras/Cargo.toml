[package]
name = "gpui-kit-markdown-extras"
version.workspace = true
edition.workspace = true
description = "GPUI TextView 的 Markdown 扩展插件：公式（$…$ / $$…$$）与 Mermaid flowchart 渲染。"
license = "MIT"
authors = ["lingdu <waong2005@126.com>"]
repository = "https://github.com/lingdu1234/gpui-kit-box.git"
homepage = "https://github.com/lingdu1234/gpui-kit-box"
documentation = "https://docs.rs/gpui-kit-markdown-extras"
readme = "README.md"
keywords = ["gpui", "markdown", "math", "mermaid", "ui"]
categories = ["gui", "rendering", "parsing"]

[dependencies]
gpui-kit.workspace = true

# 全部能力默认关闭，按图类型精确启用；未启用的 Mermaid 类型会安全回退成代码块。
# 例：default-features = false, features = ["mermaid-sequence", "mermaid-gantt"]
[features]
default = []
math = []
mermaid = [
    "mermaid-flowchart",
    "mermaid-sequence",
    "mermaid-class",
    "mermaid-state",
    "mermaid-gantt",
]
mermaid-flowchart = []
mermaid-sequence = []
mermaid-class = []
mermaid-state = []
mermaid-gantt = []
